name: Manual on Pages

# Publishes the committed user manual (docs/manual/) to GitHub Pages so it can
# be read in a browser. The HTML is generated by scripts/build_manual.py and
# committed, so this only uploads it. Runs from main only: the site shows the
# manual of the latest release.
on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - ".github/workflows/manual-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Sources and the page template are not part of the site.
      - name: Stage the manual
        run: |
          mkdir -p _site
          cp -r docs/manual/. _site/
          rm -rf _site/content _site/template.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
